- id: '1755037090883'
  alias: 3d Printer Power Supply Turn On
  description: ''
  triggers:
  - type: turned_on
    device_id: c3ce6a6d1ec3378a1f147bfdeb352575
    entity_id: 3a1ad728024d523235e82d020f3de4e5
    domain: binary_sensor
    trigger: device
  conditions: []
  actions:
  - type: turn_on
    device_id: 726411d064949e175d9d3ee0575d252b
    entity_id: e89333e79c1f4dd55d1a19e03d9018e5
    domain: switch
  - action: notify.mobile_app_tom_gsm_samsung
    metadata: {}
    data:
      message: Power Supply Turned On
      title: 3D Printer
  mode: single
- id: '1755038142591'
  alias: 3D Printer Power Supply Turn Off
  description: ''
  triggers:
  - type: turned_off
    device_id: c3ce6a6d1ec3378a1f147bfdeb352575
    entity_id: 3a1ad728024d523235e82d020f3de4e5
    domain: binary_sensor
    trigger: device
  - type: turned_on
    device_id: c3ce6a6d1ec3378a1f147bfdeb352575
    entity_id: d33d1cb72414c405158750d9690adc1c
    domain: binary_sensor
    trigger: device
  conditions: []
  actions:
  - sequence:
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - type: turn_off
      device_id: 726411d064949e175d9d3ee0575d252b
      entity_id: e89333e79c1f4dd55d1a19e03d9018e5
      domain: switch
    - action: notify.mobile_app_tom_pixel_7a
      metadata: {}
      data:
        message: Power Supply Turned Off
        title: 3D Printer
    - if:
      - type: is_on
        condition: device
        device_id: c3ce6a6d1ec3378a1f147bfdeb352575
        entity_id: d33d1cb72414c405158750d9690adc1c
        domain: binary_sensor
      then:
      - action: notify.mobile_app_tom_pixel_7a
        metadata: {}
        data:
          title: 3D Printer
          message: Printer Error Reported
  mode: single
