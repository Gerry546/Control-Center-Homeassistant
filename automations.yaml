    - input_boolean.bed_time_trigger
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.bed_time_trigger
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id:
      - living_room
      - kitchen
      - accents
      - garage
      - hobby_room
      - home_office
      - bedroom
  - action: light.turn_on
    metadata: {}
    data: {}
    target:
      area_id: bathroom
  mode: single
- id: '1754857784983'
  alias: Turn Off Lights When House Is Empty
  description: ''
  triggers:
  - trigger: zone
    entity_id: person.tom_geelen
    zone: zone.home
    event: leave
  - trigger: zone
    entity_id: person.willeke_traa
    zone: zone.home
    event: leave
  conditions:
  - condition: not
    conditions:
    - condition: zone
      entity_id: person.tom_geelen
      zone: zone.home
    - condition: zone
      entity_id: person.willeke_traa
      zone: zone.home
  actions:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      floor_id:
      - ground_floor
      - first_floor
      - outside
      - second_floor
      area_id: accents
  mode: single
- id: '1754858383689'
  alias: 'Motion Triggered Light: Toilet Downstairs'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.toilet_downstairs_motion_sensor
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - sequence:
    - if:
      - condition: time
        after: '22:00:00'
        before: 06:00:00
      then:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 10
        target:
          area_id: toilet_downstairs
      else:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
          area_id: toilet_downstairs
    - delay:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        area_id: toilet_downstairs
  mode: restart
