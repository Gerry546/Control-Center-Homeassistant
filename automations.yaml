- id: '1684965490794'
  alias: '[RFBridge] Demultiplexer'
  trigger:
  - platform: mqtt
    topic: tele/tasmota_C28E7B/RESULT
  action:
  - service: python_script.rfbridge_demux
    data_template:
      payload: '{{trigger}}'
- id: '1754855812254'
  alias: Turn on Lights on Sunset When Someone Is Home
  description: ''
  triggers:
  - trigger: sun
    event: sunset
    offset: -00:30:00
  conditions:
  - condition: or
    conditions:
    - condition: zone
      entity_id: person.willeke_traa
      zone: zone.home
      enabled: true
    - condition: zone
      entity_id: person.tom_geelen
      zone: zone.home
      enabled: true
    enabled: true
  actions:
  - action: light.turn_on
    metadata: {}
    data: {}
    target:
      area_id:
      - living_room
  - action: light.turn_on
    metadata: {}
    data:
      brightness_pct: 100
    target:
      entity_id: light.cupboard
  mode: single
- id: '1754856570923'
  alias: Turn on Lights In The Evening When Someone Comes Home
  description: ''
  triggers:
  - trigger: zone
    entity_id: person.tom_geelen
    zone: zone.home
    event: enter
  - trigger: zone
    entity_id: person.willeke_traa
    zone: zone.home
    event: enter
  conditions:
  - condition: sun
    before: sunrise
    after: sunset
    after_offset: -00:30:00
  actions:
  - action: light.turn_on
    metadata: {}
    data: {}
    target:
      area_id:
      - living_room
  - action: light.turn_on
    metadata: {}
    data:
      brightness_pct: 100
    target:
      entity_id: light.cupboard
  mode: single
- id: '1754857589194'
